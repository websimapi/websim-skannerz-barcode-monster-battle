<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Skannerz - Barcode Monster Battle</title>
  <link rel="stylesheet" href="style.css">
  <!-- Include QuaggaJS library from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/quagga/0.12.1/quagga.min.js"></script>
</head>
<body>
  <!-- Start Screen: Choose your tribe -->
  <div id="start-screen" class="screen">
    <h1>Skannerz</h1>
    <p>Welcome to Skannerz – a barcode-driven monster adventure!<br>
       Choose your tribe to begin your journey.</p>
    <div class="tribe-buttons">
      <button class="tribe-btn" data-tribe="Zendra">Zendra (Blue)</button>
      <button class="tribe-btn" data-tribe="Pataak">Pataak (Green)</button>
      <button class="tribe-btn" data-tribe="Ujalu">Ujalu (Red)</button>
    </div>
  </div>

  <!-- Scanner Screen: Use your phone camera to scan UPC codes -->
  <div id="scanner-screen" class="screen hidden">
    <h2>Scan a Barcode</h2>
    <div id="scanner-container"></div>
    <br>
    <button id="stop-scan-btn">Stop Scanning</button>
  </div>

  <!-- Result Screen: Displays collected monster or rival details -->
  <div id="result-screen" class="screen hidden">
    <div id="result-content"></div>
    <br>
    <button id="result-continue-btn">Continue</button>
  </div>

  <!-- Battle Screen: Engage in a turn-based battle -->
  <div id="battle-screen" class="screen hidden">
    <h2>Battle!</h2>
    <div id="battle-container">
      <div class="battle-monster" id="player-monster">
        <!-- Player monster info -->
      </div>
      <div class="battle-monster" id="enemy-monster">
        <!-- Enemy monster info -->
      </div>
    </div>
    <div id="battle-info">
      <p>Player HP: <span id="player-hp">100</span></p>
      <p>Enemy HP: <span id="enemy-hp">100</span></p>
    </div>
    <div id="attack-options">
      <!-- Attack buttons are added here dynamically -->
    </div>
    <br>
    <button id="battle-back-btn" class="hidden">Back to Scanner</button>
  </div>

  <script type="module" src="app.js"></script>

</body>
</html>
